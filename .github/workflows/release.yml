name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/release/linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            out/make/**/*.deb
            out/make/**/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/release/macos-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          if-no-files-found: error
          path: out/make/zip/darwin/**/*.zip

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check tag version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must equal v$version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          mapfile -d '' files < <(find release-assets -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' \) -print0)
          for extension in deb rpm zip; do
            count=$(find release-assets -type f -name "*.$extension" | wc -l)
            [[ "$count" -eq 1 ]] || { echo "Expected one .$extension asset, found $count" >&2; exit 1; }
          done
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Pocket Notebook $version" \
            --notes "Release notes will be set by the publish wizard before publishing." \
            "${files[@]}"
